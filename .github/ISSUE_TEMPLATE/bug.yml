name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: tool
    attributes: { label: Tool or page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: env
    attributes: { label: Browser and device, placeholder: Chrome 130 on Android 14 }
  - type: markdown
    attributes: { value: "Please do not attach private documents or photos." }
